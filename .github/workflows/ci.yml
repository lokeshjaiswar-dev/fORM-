name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The mailer contract also runs against a real Mailpit (packages/adapters/src/mailer/smtp.test.ts).
      mailpit:
        image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-check-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-check-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Rich text is an AST rendered as React elements (WP-0.08): no HTML sink may come back.
      - name: No HTML sinks in apps or packages
        run: |
          set +e
          git grep -nE 'innerHTML|dangerouslySetInnerHTML|execCommand' -- apps packages
          status=$?
          if [ "$status" -eq 0 ]; then echo "::error::HTML sink found in apps or packages"; exit 1; fi
          if [ "$status" -ne 1 ]; then echo "::error::git grep failed with exit code $status"; exit "$status"; fi
      - run: pnpm typecheck
      - run: pnpm i18n:extract --check
      - run: pnpm test
        env:
          FORM_TEST_MAILPIT_SMTP: smtp://localhost:1025
          FORM_TEST_MAILPIT_API: http://localhost:8025
      - run: pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-e2e-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @form/builder exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/builder/playwright-report
            apps/builder/test-results
          if-no-files-found: ignore

  # logic@2 determinism (schema §3.3.13): the corpus EvalState JSON and the pinned grapheme replay in
  # Chromium, Firefox and WebKit, diffed byte-for-byte with Node's; the templates-core corpus (instantiate,
  # snippets, sanitiser, lock fingerprints) the same way (WP-T0.2). Also the WP-0.07 benchmark, run
  # here alone and without coverage so turbo's parallel `test` tasks cannot skew it.
  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @form/logic casefold --check
      - run: pnpm test:perf
      # Browsers are cached per lockfile; --with-deps still installs the system packages on a hit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @form/logic exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:determinism
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: determinism-report
          path: |
            packages/logic/playwright-report
            packages/logic/test-results
            packages/templates-core/playwright-report
            packages/templates-core/test-results
          if-no-files-found: ignore

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deps

  # Migrations, RLS isolation for every actor kind, meta-tests, the API and the worker (pg-boss, signed job
  # envelopes, SIGTERM retries, partition maintenance) against Postgres 18 (Testcontainers). `pnpm test:int`
  # runs every package with a test:int script: packages/db, apps/api and apps/worker.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --redact --verbose .
