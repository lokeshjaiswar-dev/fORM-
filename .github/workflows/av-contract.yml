name: ClamAV contract

# The AVScanner contract against the real ClamAV engine (packages/adapters/test/scan.int.test.ts). The official image
# loads its full signature set on start, which is too slow and too large for every pull request, so the CI job `db`
# runs the contract against the fake clamd only and this workflow runs the real engine weekly and on demand.

on:
  schedule:
    - cron: '0 22 * * 0' # Monday 03:30 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clamav:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: 1
      FORM_TEST_CLAMAV: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @form/adapters exec vitest run -c vitest.int.config.ts test/scan.int.test.ts
